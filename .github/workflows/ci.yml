# Runs the test suite; the build job mirrors the one in python-publish.yml.

name: CI

on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs full history to derive the version
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt -r requirements-dev.txt
    - name: Run tests
      run: |
        pytest

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Upgrade tooling
      run: |
        python3 -m pip install --upgrade pip
        pip3 install --upgrade build setuptools setuptools_scm twine
    - name: Build package
      run: |
        python3 -m build --wheel
        python3 setup.py sdist --format=zip
    - name: Verify package
      run: |
        twine check --strict dist/*
