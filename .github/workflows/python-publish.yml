# This workflows will upload a Python Package when a release is created
# For more information see:
#     https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [ published ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Upgrade tooling
      run: |
        python3 -m pip install --upgrade pip
        pip3 install --upgrade build setuptools setuptools_scm[toml] twine wheel
    - name: Build package
      run: python3 -m build
    - name: Verify package
      run: |
        twine check dist/*
    - name: Store package
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distribution
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
    - name: Retrieve package
      uses: actions/download-artifact@v8
      with:
        name: python-package-distribution
        path: dist/
    - name: Publish package (PyPi)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        repository-url: https://upload.pypi.org/legacy/  # for testing sub https://test.pypi.org/legacy/
